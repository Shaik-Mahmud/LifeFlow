<!doctype html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="assets/icons/logo.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | LifeFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">
    <style>
        .auth-wrapper { min-height: 100vh; display: grid; place-items: center; background: var(--soft); padding: 20px; }
        .auth-card { max-width: 450px; width: 100%; padding: 40px; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); }
        .auth-brand { font-size: 1.5rem; font-weight: 800; color: var(--ink); text-decoration: none; display: flex; justify-content: center; align-items: center; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card text-center">
            <a class="auth-brand" href="index.html">
                <span class="brand-mark"><i class="fa-solid fa-droplet"></i></span>LifeFlow
            </a>
            <h2 class="h4 fw-bold mb-3">Reset Password</h2>
            <p class="text-secondary mb-4">Enter your email address and we'll send you a link to reset your password.</p>
            
            <form class="needs-validation text-start" novalidate id="resetForm">
                <div class="mb-4">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" required>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>
                <button type="submit" class="btn btn-danger w-100">Send Reset Link</button>
            </form>
            <p class="mt-4 mb-0"><a href="index.html" class="text-decoration-none text-muted"><i class="fa-solid fa-arrow-left me-1"></i> Back to Home</a></p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if(this.checkValidity()) {
                Swal.fire('Link Sent!', 'If an account exists with that email, a reset link has been sent.', 'success').then(() => {
                    window.location.href = 'index.html';
                });
            }
            this.classList.add('was-validated');
        });
    </script>
</body>
</html>
